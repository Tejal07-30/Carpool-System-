<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – RideNode</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body { background: #f4f6f9; font-family: 'Segoe UI', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-box { width: 100%; max-width: 420px; }
    .login-header { text-align: center; margin-bottom: 28px; }
    .login-header h2 { font-weight: 700; font-size: 1.6rem; color: #212529; }
    .login-header h2 span { color: #4e8cff; }
    .login-header p { color: #6c757d; font-size: .9rem; margin-top: 4px; }
    .card { border: 1px solid #dee2e6; border-radius: 6px; box-shadow: 0 2px 8px rgba(0,0,0,.07); }
    .card-body { padding: 28px; }
    label { font-size: .8rem; font-weight: 600; color: #495057; text-transform: uppercase; letter-spacing: .04em; }
    .form-control { border-radius: 4px; font-size: .9rem; border-color: #ced4da; }
    .form-control:focus { border-color: #4e8cff; box-shadow: 0 0 0 2px rgba(78,140,255,.15); }
    .btn-primary { background: #4e8cff; border-color: #4e8cff; font-weight: 600; }
    .btn-primary:hover { background: #2d6fe0; border-color: #2d6fe0; }
    .divider { display: flex; align-items: center; gap: 12px; color: #adb5bd; font-size: .8rem; margin: 18px 0; }
    .divider::before, .divider::after { content: ''; flex: 1; border-top: 1px solid #dee2e6; }
    .google-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 9px; background: #fff; border: 1px solid #dee2e6; border-radius: 4px; color: #212529; font-size: .875rem; font-weight: 500; text-decoration: none; transition: border-color .2s, background .2s; }
    .google-btn:hover { background: #f8f9fa; border-color: #adb5bd; color: #212529; }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="login-header">
      <h2>Ride<span>Node</span></h2>
      <p>Node-based carpooling system</p>
    </div>
    <div class="card">
      <div class="card-body">
        <h6 class="mb-3" style="font-weight:600;color:#212529;">Sign in to your account</h6>

        {% if error %}
        <div class="alert alert-danger py-2" style="font-size:.875rem;">{{ error }}</div>
        {% endif %}

        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-danger py-2" style="font-size:.875rem;">{{ message }}</div>
        {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'login' %}">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" placeholder="Enter username" autofocus required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" placeholder="Enter password" required>
          </div>
          <button type="submit" class="btn btn-primary w-100 mt-1">Sign In</button>
        </form>

        <div class="divider">or</div>

        <a href="{% url 'google_login' %}" class="google-btn">
          <svg width="16" height="16" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/></svg>
          Continue with Google
        </a>
      </div>
    </div>
  </div>
</body>
</html>
