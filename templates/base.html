<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}RideNode{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body { background: #f4f6f9; font-family: 'Segoe UI', sans-serif; }
    .sidebar {
      width: 220px; min-height: 100vh; background: #212529;
      position: fixed; top: 0; left: 0; z-index: 100;
      padding-top: 0;
    }
    .sidebar-brand {
      display: block; padding: 18px 20px;
      background: #1a1e21; color: #fff;
      font-size: 1.15rem; font-weight: 700;
      text-decoration: none; border-bottom: 1px solid #343a40;
      letter-spacing: .01em;
    }
    .sidebar-brand span { color: #4e8cff; }
    .sidebar-section {
      padding: 18px 20px 4px;
      font-size: .68rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: .08em;
      color: #6c757d;
    }
    .sidebar a {
      display: flex; align-items: center; gap: 9px;
      padding: 8px 20px; color: #adb5bd;
      text-decoration: none; font-size: .875rem;
      transition: background .15s, color .15s;
      border-left: 3px solid transparent;
    }
    .sidebar a:hover { background: #2c3034; color: #fff; }
    .sidebar a.active { background: #2c3034; color: #fff; border-left-color: #4e8cff; }
    .sidebar a i { font-size: 1rem; width: 18px; text-align: center; }
    .sidebar-footer {
      position: absolute; bottom: 0; width: 100%;
      padding: 14px 20px; border-top: 1px solid #343a40;
      font-size: .8rem; color: #6c757d;
    }
    .sidebar-footer strong { color: #adb5bd; display: block; }
    .main-content { margin-left: 220px; }
    .topbar {
      background: #fff; border-bottom: 1px solid #dee2e6;
      padding: 12px 28px; display: flex; align-items: center;
      justify-content: space-between; gap: 1rem;
      position: sticky; top: 0; z-index: 99;
    }
    .topbar h5 { margin: 0; font-weight: 600; font-size: 1rem; color: #212529; }
    .topbar-right { display: flex; align-items: center; gap: 12px; }
    .topbar-right .badge { font-size: .72rem; padding: .3em .6em; }
    .content { padding: 28px; }
    .page-title { font-size: 1.4rem; font-weight: 700; color: #212529; margin-bottom: 4px; }
    .page-sub { font-size: .875rem; color: #6c757d; margin-bottom: 24px; }    
    .card { border: 1px solid #dee2e6; border-radius: 6px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
    .card-header { background: #f8f9fa; border-bottom: 1px solid #dee2e6; font-weight: 600; font-size: .875rem; padding: 12px 16px; }
    .stat-card { border-left: 4px solid; border-radius: 6px; padding: 16px 20px; background: #fff; }
    .stat-card.blue { border-left-color: #4e8cff; }
    .stat-card.green { border-left-color: #28a745; }
    .stat-card.yellow { border-left-color: #ffc107; }
    .stat-card.red { border-left-color: #dc3545; }
    .stat-card .stat-val { font-size: 1.6rem; font-weight: 700; color: #212529; line-height: 1; }
    .stat-card .stat-lbl { font-size: .75rem; color: #6c757d; margin-top: 4px; text-transform: uppercase; letter-spacing: .05em; }
    .table th { font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; color: #6c757d; background: #f8f9fa; }
    .table td { font-size: .875rem; vertical-align: middle; }
    .route-node { display: inline-block; padding: 3px 10px; border-radius: 99px; font-size: .78rem; font-weight: 500; background: #f0f0f0; border: 1px solid #dee2e6; color: #495057; }
    .route-node.current { background: #e8f0ff; border-color: #4e8cff; color: #4e8cff; }
    .route-node.visited { background: #f8f9fa; color: #adb5bd; text-decoration: line-through; border-color: #e9ecef; }
    .route-arrow { color: #adb5bd; font-size: .8rem; margin: 0 2px; }
    .badge-status-active    { background: #e8f0ff; color: #4e8cff; border: 1px solid #c5d8ff; }
    .badge-status-pending   { background: #fff8e1; color: #e6a817; border: 1px solid #ffe082; }
    .badge-status-confirmed { background: #e8f5e9; color: #28a745; border: 1px solid #a5d6a7; }
    .badge-status-completed { background: #e8f5e9; color: #28a745; border: 1px solid #a5d6a7; }
    .badge-status-cancelled { background: #fdecea; color: #dc3545; border: 1px solid #f5c6cb; }
    .badge-status-rejected  { background: #f8f9fa; color: #6c757d; border: 1px solid #dee2e6; }
    .badge-status-accepted  { background: #e8f5e9; color: #28a745; border: 1px solid #a5d6a7; }
    .badge-status-driver    { background: #e8f0ff; color: #4e8cff; border: 1px solid #c5d8ff; }
    .badge-status-passenger { background: #fff8e1; color: #e6a817; border: 1px solid #ffe082; }
    .badge-status-credit    { background: #e8f5e9; color: #28a745; border: 1px solid #a5d6a7; }
    .badge-status-debit     { background: #fdecea; color: #dc3545; border: 1px solid #f5c6cb; }
    .status-badge { display: inline-block; padding: 3px 9px; border-radius: 4px; font-size: .72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
    .alert { border-radius: 4px; font-size: .875rem; }
    .empty-state { text-align: center; padding: 48px 24px; color: #6c757d; }
    .empty-state i { font-size: 2.5rem; color: #ced4da; display: block; margin-bottom: 12px; }
    .empty-state h5 { color: #495057; margin-bottom: 6px; }
    .btn { border-radius: 4px; font-size: .875rem; }
    .btn-sm { font-size: .78rem; }
    select, input[type=number], input[type=text], input[type=password] { border-radius: 4px; }
  </style>
</head>
<body>

{% include "components/navbar.html" %}

<div class="main-content">
  <div class="content">
    {% if messages %}
      {% for message in messages %}
        {% if message.tags == 'error' %}
          <div class="alert alert-danger alert-dismissible fade show" role="alert" style="margin-bottom:16px;">
        {% elif message.tags == 'success' %}
          <div class="alert alert-success alert-dismissible fade show" role="alert" style="margin-bottom:16px;">
        {% elif message.tags == 'warning' %}
          <div class="alert alert-warning alert-dismissible fade show" role="alert" style="margin-bottom:16px;">
        {% else %}
          <div class="alert alert-info alert-dismissible fade show" role="alert" style="margin-bottom:16px;">
        {% endif %}
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
